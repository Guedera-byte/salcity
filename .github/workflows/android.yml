# Forçando a execução do CI
name: Android CI

on:
  pull_request:
    branches: [ mestre ]
  push:
    branches: [ mestre ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Permissão de execução para o Gradle Wrapper
        run: chmod +x gradlew

      - name: Build e testes unitários
        run: ./gradlew assembleDebug testDebugUnitTest
