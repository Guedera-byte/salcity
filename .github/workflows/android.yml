name: Android CI

on:
  push:
    branches: [ "mestre" ]
  pull_request:
    branches: [ "mestre" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Permissão de execução para o Gradle Wrapper
        run: chmod +x gradlew

      - name: Build e testes
        run: ./gradlew assembleDebug testDebugUnitTest
